# Official URL kept in git. If services.gradle.org is blocked, run
# python scripts/pick_build_mirrors.py --fetch-gradle and point
# distributionUrl at a printed candidate locally (do not commit a pin).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# 10s is the wrapper default and it is a hard per-read timeout, not a total
# budget: a single stalled read on a cold CI runner aborts the whole build
# before Gradle ever starts (observed on GH-hosted ubuntu-22.04, "Downloading
# ... failed: timeout (10000ms)"). 120s keeps a genuine hang bounded without
# failing on ordinary jitter.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
