# Memory budget for this phone (~5 GB usable). Two phases, two different owners:
#
#   1. Kotlin compile -> runs in the KOTLIN DAEMON (execution.strategy=daemon),
#      so the daemon must be the fat one. 1536m died with GC-overhead OOM in IR
#      lowering; 3072m is the proven size on this codebase.
#   2. R8 / minifyRelease -> runs INSIDE the Gradle process, after the Kotlin
#      daemon has gone idle. It needs the fat heap instead.
#
# The two peaks never overlap, so the numbers below are sized for phase 1
# (1536 + 3072 = 4608m, fits in ~5 GB). For the R8 phase bump Gradle to 4608m
# and drop the daemon — see the release recipe at the bottom of this file.
# Do NOT set execution.strategy=in-process: that folds the whole Kotlin compile
# into the Gradle heap and OOMs at 1 GB regardless of these numbers.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# First-build Maven/Gradle mirrors. auto|cn|off — see scripts/pick_build_mirrors.py
# and the built-in android-sdk-mirrors skill. Do not pin a single mirror URL.
# MINIS_BUILD_MIRRORS=auto
kotlin.compiler.execution.strategy=daemon

# 明确指定可用 JDK，避免 toolchain 探测到无 javac 的 JRE
org.gradle.java.installations.paths=/opt/jdk17,/usr/lib/jvm/java-21-openjdk-arm64
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# --- release APK recipe (two passes, both needed on this device) -------------
# pass 1 — Kotlin:  ./gradlew :app:compileReleaseKotlin     (config above)
# pass 2 — R8:      ./gradlew :app:assembleRelease \
#                     -Dorg.gradle.jvmargs="-Xmx4608m -XX:MaxMetaspaceSize=768m"
#                   (Kotlin is UP-TO-DATE by then, so the daemon stays idle)
#
# Collapsing both into one invocation re-uses one Gradle heap for R8 and OOMs.

# API 37 需要更新的 AGP；先让 8.7.3 通过编译，后续再抬 AGP。
android.suppressUnsupportedCompileSdk=37
