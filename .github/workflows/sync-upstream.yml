name: Sync from upstream

# 每 6 小时把上游 main 拉到本 fork 的 main，保持镜像。
# 手动触发：Actions → Sync from upstream → Run workflow（可临时换上游仓库）。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: "上游仓库，格式 owner/repo"
        required: false
        default: "tall-1997/OpenMinis-Linux"
      branch:
        description: "要同步的分支"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        env:
          UPSTREAM: ${{ inputs.upstream || 'tall-1997/OpenMinis-Linux' }}
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags --prune upstream "+refs/heads/*:refs/remotes/upstream/*"

          echo "上游：${UPSTREAM}  分支：${BRANCH}"

          if ! git rev-parse --verify "refs/remotes/upstream/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::上游不存在分支 ${BRANCH}"
            exit 1
          fi

          if git merge-base --is-ancestor "refs/remotes/upstream/${BRANCH}" HEAD; then
            echo "已经是最新，无需同步。"
            exit 0
          fi

          echo "落后 $(git rev-list --count HEAD..refs/remotes/upstream/${BRANCH}) 个提交，开始同步。"
          if git rebase "refs/remotes/upstream/${BRANCH}"; then
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
            echo "同步完成：$(git rev-parse --short HEAD)"
          else
            git rebase --abort || true
            echo "::error::与上游冲突，自动同步已中止。请手动 merge 解决一次，之后会恢复自动同步。"
            exit 1
          fi
